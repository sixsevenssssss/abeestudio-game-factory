<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d1a">
  <title>{{GAME_TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d1a; font-family: Arial, sans-serif; }
    #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
    #game-ui { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
    #preloader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0d1a; z-index: 9999; }
    #preloader-spinner { width: 40px; height: 40px; border: 3px solid rgba(245,197,24,0.3); border-top-color: #f5c518; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="preloader"><div id="preloader-spinner"></div></div>
  <canvas id="game-canvas"></canvas>
  <div id="game-ui"></div>
  <!-- Яндекс SDK: ОБЯЗАТЕЛЬНО до main.js (требование п. 1.1) -->
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <script type="module" src="./src/game/main.js"></script>
</body>
</html>
